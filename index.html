<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F7F86">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="트인길">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>트인길 Openroad</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --sky:#E6F1F7; --panel:#FFFFFF; --ink:#183243; --muted:#5B7486;
  --line:#CFE0EA; --route:#1F7F86; --route-soft:#D7EEEF; --under:#D2581C; --under-soft:#FBE6DA;
  --focus:#2B6CB0; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#0F1E28; --panel:#16293A; --ink:#E4EEF4; --muted:#93AABA;
    --line:#284257; --route:#4FC1C7; --route-soft:#173B42; --under:#F08A4B; --under-soft:#3D2416;
    --focus:#7FB3E8; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Pretendard",-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;background:var(--sky);color:var(--ink);font-size:16px;line-height:1.5}
#map{position:fixed;inset:0;z-index:0}
.leaflet-container{background:var(--sky)}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);
  border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(24,50,67,.18);
  max-height:72vh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);transition:transform .25s ease}
.sheet.min{transform:translateY(calc(100% - 64px - env(safe-area-inset-bottom,0px)))}
.handle{border:0;background:none;width:100%;padding:10px 20px 6px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;color:var(--ink);font:inherit}
.handle::before{content:"";position:absolute;left:50%;top:7px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand small{font-weight:500;font-size:13px;color:var(--muted);margin-left:6px}
.handle span.chev{font-size:14px;color:var(--muted)}
.body{overflow-y:auto;padding:4px 20px 20px}

label.field{display:block;margin-top:12px}
.field-label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px;display:block}
.inrow{display:flex;gap:8px}
input[type=text],input[type=password]{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--sky);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
input:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.ghost{font:inherit;font-size:14px;font-weight:600;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:0 12px;cursor:pointer;white-space:nowrap}
.resolved{font-size:12px;color:var(--muted);margin-top:4px;min-height:0}

.toggles{margin-top:16px;border-top:1px solid var(--line)}
.tog{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tog b{display:block;font-weight:700}
.tog em{display:block;font-style:normal;font-size:13px;color:var(--muted)}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:15px;background:var(--line);transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked + i{background:var(--route)}
.sw input:checked + i::after{transform:translateX(22px)}
.sw input:focus-visible + i{outline:3px solid var(--focus);outline-offset:2px}

.go{display:block;width:100%;margin-top:18px;font:inherit;font-size:17px;font-weight:700;border:0;border-radius:14px;padding:15px;background:var(--route);color:#fff;cursor:pointer}
.install{display:block;width:100%;margin-top:10px;padding:12px}
.install[hidden]{display:none}
.go:disabled{opacity:.6;cursor:progress}
details.key{margin-top:14px;font-size:14px;color:var(--muted)}
details.key summary{cursor:pointer}
details.key p{margin:6px 0}
details.key a{color:var(--route)}

.msg{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:14px;display:none}
.msg.show{display:block}
.msg.err{background:var(--under-soft);color:var(--ink)}
.msg.info{background:var(--route-soft);color:var(--ink)}

/* 결과: 하늘 게이지가 이 화면의 중심 */
.result{display:none;margin-top:18px}
.result.show{display:block}
.skyline{display:flex;align-items:baseline;gap:10px}
.skyline strong{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--route)}
.skyline span{font-size:15px;color:var(--muted)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--route);margin:12px 0 6px}
.bar i{display:block;background:var(--under)}
.meta{font-size:15px;margin-top:6px}
.under-list{margin:12px 0 0;padding:0;list-style:none}
.under-list li{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;margin-top:6px;border-radius:10px;background:var(--under-soft);font-size:14px;cursor:pointer}
.under-list .u-name{flex:1;min-width:0}
.under-list .u-len{color:var(--muted);white-space:nowrap}
.u-avoid{font:inherit;font-size:13px;font-weight:600;border:1.5px solid var(--under);color:var(--ink);background:var(--panel);border-radius:9px;padding:6px 9px;cursor:pointer;white-space:nowrap}
.cands{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
.cands[hidden]{display:none}
.cand-note{margin:0 0 12px;font-size:13px;color:var(--muted)}
.cand-note:empty{display:none}
.cand{flex:1 0 108px;text-align:left;font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.cand[aria-checked="true"]{border-color:var(--route);background:var(--route-soft)}
.cand b{display:block;font-size:13px;color:var(--route)}
.cand span{display:block;font-size:18px;font-weight:800;letter-spacing:-.02em}
.cand em{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.steps{margin:16px 0 0;padding:0 0 0 20px;font-size:14px}
.steps li{padding:5px 0;border-bottom:1px solid var(--line)}
.steps li span{color:var(--muted);margin-left:6px}
h3{font-size:15px;margin:18px 0 0}
.again{margin-top:14px;width:100%;padding:12px}
.locate{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));z-index:9;width:48px;height:48px;border-radius:50%;
  border:0;background:var(--panel);color:var(--muted);box-shadow:0 3px 12px rgba(24,50,67,.22);display:grid;place-items:center;cursor:pointer}
.locate[aria-pressed="true"]{color:#2F80ED}
.locate.wait{animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
.me{position:relative;width:22px;height:22px}
.me .dot{position:absolute;inset:3px;border-radius:50%;background:#2F80ED;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.me .pulse{position:absolute;inset:-8px;border-radius:50%;background:rgba(47,128,237,.25);animation:pulse 2s ease-out infinite}
.me .cone{position:absolute;left:50%;top:50%;width:0;height:0;margin-left:-9px;margin-top:-26px;border-left:9px solid transparent;border-right:9px solid transparent;
  border-bottom:18px solid rgba(47,128,237,.55);transform-origin:9px 26px;display:none}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion: reduce){.me .pulse,.locate.wait{animation:none}}
@media (prefers-reduced-motion: reduce){.sheet,.sw i,.sw i::after{transition:none}}
@media (min-width:760px){
  .sheet{left:16px;right:auto;bottom:16px;top:16px;width:400px;max-height:none;border-radius:22px}
  .sheet.min{transform:none}
}
</style>
</head>
<body>
<div id="map" role="application" aria-label="지도"></div>
<button class="locate" id="locate" type="button" aria-label="내 위치 보기" aria-pressed="false">
  <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>

<section class="sheet" id="sheet">
  <button class="handle" id="handle" aria-expanded="true" aria-controls="sheetBody">
    <span class="brand">트인길<small>터널·지하차도 없이 가는 길</small></span><span class="chev" id="chev">접기</span>
  </button>
  <div class="body" id="sheetBody">
    <form id="form" autocomplete="off">
      <label class="field"><span class="field-label">출발지</span>
        <span class="inrow"><input type="text" id="from" placeholder="예: 인천시청" required>
        <button type="button" class="ghost" id="here">현재 위치</button></span>
        <div class="resolved" id="fromRes"></div>
      </label>
      <label class="field"><span class="field-label">목적지</span>
        <span class="inrow"><input type="text" id="to" placeholder="예: 송도 센트럴파크" required></span>
        <div class="resolved" id="toRes"></div>
      </label>

      <div class="toggles">
        <label class="tog"><span><b>터널 피하기</b><em>산·도심 관통 터널을 지나지 않아요</em></span>
          <span class="sw"><input type="checkbox" id="avoidTunnel" checked><i></i></span></label>
        <label class="tog"><span><b>지하차도 피하기</b><em>교차로 아래로 내려가는 길을 지나지 않아요</em></span>
          <span class="sw"><input type="checkbox" id="avoidUnder" checked><i></i></span></label>
      </div>

      <button class="go" id="go" type="submit">경로 탐색</button>
      <button class="ghost install" id="install" type="button">홈 화면에 앱 설치</button>
    </form>

    <div class="msg" id="msg" role="status"></div>

    <div class="result" id="result" aria-live="polite">
      <div class="cands" id="cands" role="radiogroup" aria-label="경로 후보" hidden></div>
      <p class="cand-note" id="candNote"></p>
      <div class="skyline"><strong id="pct">100%</strong><span>하늘이 보이는 구간</span></div>
      <div class="bar" id="bar" aria-hidden="true"></div>
      <div class="meta" id="meta"></div>
      <ul class="under-list" id="underList"></ul>
      <h3>안내</h3>
      <ol class="steps" id="steps"></ol>
      <button class="ghost again" id="again" type="button">다시 검색</button>
    </div>
  </div>
</section>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
<script>
const $ = s => document.querySelector(s);
const VALHALLA = 'https://valhalla1.openstreetmap.de';
const MAX_EXCLUDE = 50;     // 공개 서버의 제외 지점 한도
const MAX_ROUNDS = 8;

/* ---------- 지도 ---------- */
const map = L.map('map',{zoomControl:false}).setView([37.4563,126.7052],12);
// 지도 배경: OpenFreeMap (API 키·가입 불필요). 불러오지 못하면 OSM 래스터 타일로 대체
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
function rasterFallback(){
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
}
try{
  if(!window.maplibregl || !L.maplibreGL) throw new Error('no maplibre');
  const gl=L.maplibreGL({
    style:`https://tiles.openfreemap.org/styles/${dark?'dark':'liberty'}`,
    attribution:'<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © OpenStreetMap'
  }).addTo(map);
  gl.getMaplibreMap().on('error',e=>console.warn('지도 배경 오류',e && e.error));
  // 지명을 한국어로 표시
  gl.getMaplibreMap().once('load',()=>{
    const m=gl.getMaplibreMap();
    m.getStyle().layers.forEach(l=>{
      if(l.type==='symbol' && l.layout && l.layout['text-field'])
        m.setLayoutProperty(l.id,'text-field',['coalesce',['get','name:ko'],['get','name']]);
    });
  });
}catch(e){ rasterFallback(); }
const layer = L.layerGroup().addTo(map);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- 화면 ---------- */
const sheet=$('#sheet'), handle=$('#handle');
handle.onclick=()=>{ const m=sheet.classList.toggle('min'); handle.setAttribute('aria-expanded',!m); $('#chev').textContent=m?'펼치기':'접기'; };
function showMsg(text,type='err'){ const m=$('#msg'); m.textContent=text; m.className='msg show '+type; }
function clearMsg(){ $('#msg').className='msg'; }
$('#from').addEventListener('input',()=>{ delete $('#from').dataset.lat; });

/* ---------- 실시간 내 위치 ---------- */
const me={marker:null,circle:null,watch:null,follow:false,last:null,wanted:false};
const meIcon=L.divIcon({className:'',html:'<div class="me"><div class="pulse"></div><div class="cone"></div><div class="dot"></div></div>',iconSize:[22,22],iconAnchor:[11,11]});
function onPos(p){
  const ll=[p.coords.latitude,p.coords.longitude], acc=p.coords.accuracy||0;
  const first=!me.last; me.last=p.coords;
  $('#locate').classList.remove('wait');
  if(!me.marker){
    me.circle=L.circle(ll,{radius:acc,color:'#2F80ED',weight:1,opacity:.4,fillColor:'#2F80ED',fillOpacity:.1,interactive:false}).addTo(map);
    me.marker=L.marker(ll,{icon:meIcon,keyboard:false,zIndexOffset:1000}).bindTooltip('내 위치').addTo(map);
  } else { me.marker.setLatLng(ll); me.circle.setLatLng(ll).setRadius(acc); }
  // 움직이는 중이면 진행 방향 표시
  const cone=me.marker.getElement()&&me.marker.getElement().querySelector('.cone');
  if(cone){ const h=p.coords.heading, moving=h!=null&&!isNaN(h)&&(p.coords.speed||0)>1;
    cone.style.display=moving?'block':'none'; if(moving) cone.style.transform=`rotate(${h}deg)`; }
  if(me.follow) map.panTo(ll,{animate:true});
  else if(first && me.wanted) map.setView(ll,16);
}
function onPosErr(err){
  $('#locate').classList.remove('wait');
  if(err.code===1){ stopWatch(); me.wanted=false; setFollow(false);
    showMsg('위치 권한이 꺼져 있어요. 휴대폰 설정 → 애플리케이션 → 브라우저 → 권한에서 위치를 허용해 주세요.'); }
}
function startWatch(){
  if(!navigator.geolocation){ showMsg('이 브라우저는 위치 기능을 지원하지 않아요.'); return false; }
  if(me.watch==null){
    if(!me.last) $('#locate').classList.add('wait');
    me.watch=navigator.geolocation.watchPosition(onPos,onPosErr,{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  }
  return true;
}
function stopWatch(){ if(me.watch!=null){ navigator.geolocation.clearWatch(me.watch); me.watch=null; } }
function setFollow(on){ me.follow=on; $('#locate').setAttribute('aria-pressed',on); }

// 내 위치 버튼: 누르면 내 위치로 이동하고, 움직일 때 지도가 따라감
$('#locate').onclick=()=>{
  me.wanted=true;
  if(!startWatch()) return;
  setFollow(true);
  if(me.last) map.setView([me.last.latitude,me.last.longitude],Math.max(map.getZoom(),16));
};
map.on('dragstart',()=>setFollow(false));   // 손으로 지도를 움직이면 따라가기 멈춤

// 화면을 끄거나 다른 앱으로 가면 배터리를 위해 위치 추적을 멈췄다가, 돌아오면 다시 시작
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) stopWatch(); else if(me.wanted) startWatch();
});
// 이미 위치 권한을 허용한 기기라면 앱을 열자마자 내 위치 표시
if(navigator.permissions && navigator.permissions.query){
  navigator.permissions.query({name:'geolocation'}).then(r=>{ if(r.state==='granted'){ me.wanted=true; startWatch(); } }).catch(()=>{});
}

// 출발지 '현재 위치' 버튼
$('#here').onclick=()=>{
  if(!navigator.geolocation){ showMsg('이 브라우저는 위치 기능을 지원하지 않아요. 출발지를 직접 입력해 주세요.'); return; }
  const fill=c=>{ const f=$('#from'); f.value='현재 위치'; f.dataset.lat=c.latitude; f.dataset.lng=c.longitude; $('#here').textContent='현재 위치'; };
  me.wanted=true; startWatch();
  if(me.last){ fill(me.last); map.setView([me.last.latitude,me.last.longitude],15); return; }
  $('#here').textContent='찾는 중…';
  navigator.geolocation.getCurrentPosition(p=>{ fill(p.coords); onPos(p); map.setView([p.coords.latitude,p.coords.longitude],15); },
    ()=>{ $('#here').textContent='현재 위치'; showMsg('위치 권한이 꺼져 있어요. 휴대폰 설정에서 브라우저 위치 권한을 허용하거나 출발지를 직접 입력해 주세요.'); },
    {enableHighAccuracy:true,timeout:10000});
};

/* ---------- 좌표 계산 ---------- */
function hav(a,b){ const R=6371000,r=Math.PI/180; const dLat=(b[1]-a[1])*r,dLng=(b[0]-a[0])*r;
  const x=Math.sin(dLat/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function lineLen(c){ let s=0; for(let i=1;i<c.length;i++) s+=hav(c[i-1],c[i]); return s; }
function bearing(a,b){ const r=Math.PI/180, dl=(b[0]-a[0])*r;
  const y=Math.sin(dl)*Math.cos(b[1]*r), x=Math.cos(a[1]*r)*Math.sin(b[1]*r)-Math.sin(a[1]*r)*Math.cos(b[1]*r)*Math.cos(dl);
  return Math.round((Math.atan2(y,x)/r+360)%360); }
function midpointWithHeading(c){        // 선의 정중앙 좌표와 진행 방향
  const half=lineLen(c)/2; let acc=0;
  for(let i=1;i<c.length;i++){ const d=hav(c[i-1],c[i]);
    if(acc+d>=half){ const t=d?(half-acc)/d:0;
      return {lon:c[i-1][0]+(c[i][0]-c[i-1][0])*t, lat:c[i-1][1]+(c[i][1]-c[i-1][1])*t, heading:bearing(c[i-1],c[i])}; }
    acc+=d; }
  return {lon:c[0][0],lat:c[0][1],heading:bearing(c[0],c[c.length-1])};
}
function decode(str,prec=6){ let i=0,lat=0,lng=0; const out=[],f=10**prec;
  while(i<str.length){ for(const k of [0,1]){ let b,s=0,r=0;
      do{ b=str.charCodeAt(i++)-63; r|=(b&31)<<s; s+=5; }while(b>=32);
      const d=(r&1)?~(r>>1):(r>>1); if(k===0) lat+=d; else lng+=d; }
    out.push([lng/f,lat/f]); }
  return out; }
const km = m => m>=1000 ? (m/1000).toFixed(1)+'km' : Math.round(m)+'m';
const mins = s => { const t=Math.round(s/60); return t>=60 ? `${Math.floor(t/60)}시간 ${t%60}분` : `${t}분`; };

/* ---------- 1·2단계: 장소 검색 ---------- */
async function geocode(input){
  if(input.dataset.lat) return {lat:+input.dataset.lat,lng:+input.dataset.lng,label:'현재 위치'};
  const q=input.value.trim();
  const m=q.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
  if(m) return {lat:+m[1],lng:+m[2],label:q};
  const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=kr&accept-language=ko&q=${encodeURIComponent(q)}`);
  if(!r.ok) throw new Error('장소 검색 서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.');
  const j=await r.json();
  if(!j.length) throw new Error(`"${q}"을(를) 찾지 못했어요. 시·구 이름을 붙이거나 더 정확한 장소명을 입력해 주세요.`);
  return {lat:+j[0].lat,lng:+j[0].lon,label:j[0].display_name};
}

/* ---------- 터널 / 지하차도 구분 ---------- */
function kindOf(name,lengthM){
  if(/지하차도|지하도|underpass/i.test(name)) return 'underpass';
  if(/터널|tunnel/i.test(name)) return 'tunnel';
  return lengthM<500 ? 'underpass' : 'tunnel';      // 이름이 없으면 짧은 것을 지하차도로 간주
}

/* ---------- 5단계: 경로 계산 (Valhalla) ---------- */
async function post(path,body){
  const r=await fetch(VALHALLA+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(r.status===429) throw Object.assign(new Error('경로 서버 사용량이 많아요. 1분쯤 뒤에 다시 시도해 주세요.'),{fatal:true});
  if(!r.ok) throw Object.assign(new Error(j.error||`경로 서버 오류 (${r.status})`),{code:j.error_code});
  return j;
}
let lang='ko-KR';
// 경로 1개(+ alternates개의 다른 길)를 받아 trip 배열로 돌려줌
async function route(a,b,excludes,alternates=0,opts=null){
  const body={locations:[{lat:a.lat,lon:a.lng},{lat:b.lat,lon:b.lng}],costing:'auto',
    directions_options:{units:'kilometers',language:lang}};
  if(opts) body.costing_options={auto:opts};
  if(excludes.length) body.exclude_locations=excludes.map(e=>({lat:e.lat,lon:e.lon,heading:e.heading,heading_tolerance:30,radius:3}));
  if(alternates) body.alternates=alternates;
  const pack=j=>[j.trip,...(j.alternates||[]).map(x=>x.trip)].filter(Boolean);
  try{ return pack(await post('/route',body)); }
  catch(e){
    if(lang && /language/i.test(e.message)){ lang=null; delete body.directions_options.language; return pack(await post('/route',body)); }
    if(alternates && !e.fatal && e.code!==442){ delete body.alternates; return pack(await post('/route',body)); }
    throw e;
  }
}
// 경로가 실제로 지나는 도로를 하나씩 확인해 지하 구간을 찾아냄
async function findUnderground(shapeStr){
  const j=await post('/trace_attributes',{encoded_polyline:shapeStr,shape_match:'edge_walk',costing:'auto',
    filters:{attributes:['edge.tunnel','edge.names','edge.begin_shape_index','edge.end_shape_index','shape'],action:'include'}});
  const shape=j.shape?decode(j.shape):decode(shapeStr);
  const segs=[]; let cur=null;
  for(const e of (j.edges||[])){
    if(e.tunnel){
      if(!cur){ cur={from:e.begin_shape_index,to:e.end_shape_index,names:new Set()}; segs.push(cur); }
      cur.to=e.end_shape_index; (e.names||[]).forEach(n=>cur.names.add(n));
    } else cur=null;
  }
  return segs.map(s=>{ const coords=shape.slice(s.from,s.to+1), len=lineLen(coords), name=[...s.names].join(' ');
    return {coords,len,name,kind:kindOf(name,len)}; });
}

/* ---------- 경로 후보 관리 ---------- */
const state={a:null,b:null,avoidT:true,avoidU:true,cands:[],sel:0,manual:[]};
const avoided=u=>(u.kind==='tunnel'&&state.avoidT)||(u.kind==='underpass'&&state.avoidU);
function score(c){
  c.dist=c.trip.summary.length*1000; c.time=c.trip.summary.time;
  c.underLen=c.under.reduce((s,u)=>s+u.len,0);
  c.blocked=c.under.filter(avoided).reduce((s,u)=>s+u.len,0);
  return c;
}
function addCand(list,c){
  score(c);
  const dup=list.find(x=>Math.abs(x.dist-c.dist)<x.dist*0.01 && Math.abs(x.time-c.time)<Math.max(30,x.time*0.01));
  if(dup) return dup;
  list.push(c); return c;
}
// 후보 중 최대 3개: 지하 가장 적음 / 가장 빠름 / 그 사이(또는 다른 길)
function pickCands(list){
  const any=state.avoidT||state.avoidU, m=c=>any?c.blocked:c.underLen;
  const byUnder=[...list].sort((x,y)=>m(x)-m(y)||x.time-y.time);
  const byTime=[...list].sort((x,y)=>x.time-y.time);
  const best=byUnder[0], fastest=byTime[0];
  list.forEach(c=>c.tag=null);
  const out=[best];
  if(fastest!==best) out.push(fastest);
  const mid=byTime.find(c=>!out.includes(c) && m(c)<m(fastest) && c.time<best.time);
  if(mid) out.splice(1,0,mid);
  for(const c of byTime){ if(out.length>=3) break; if(!out.includes(c)) out.push(c); }
  best.tag = m(best)===0 ? '지하 없음' : '지하 가장 적음';
  if(fastest!==best) fastest.tag='가장 빠름';
  if(mid) mid.tag='균형';
  out.forEach(c=>{ if(!c.tag) c.tag='다른 길'; });
  return out.sort((x,y)=>m(x)-m(y)||x.time-y.time);
}

/* ---------- 경로 찾기 ---------- */
// 한 가지 경로 성격(opts)에 대해: 경로 → 지하 구간 확인 → 막고 다시 찾기를 반복
async function refine(all,excludes,opts,rounds,progress,withAlt){
  for(let round=0; round<rounds; round++){
    let trips;
    try{ trips=await route(state.a,state.b,excludes,withAlt&&round===0?2:0,opts); }
    catch(e){ if(e.fatal) throw e; if(!all.length && !opts) throw e; return; }
    let main=null;
    for(let k=0;k<trips.length;k++){
      let under, unknown=false;
      try{ under=await findUnderground(trips[k].legs[0].shape); }
      catch(e){ if(e.fatal) throw e; if(k>0) continue; under=[]; unknown=true; }
      const before=all.length, c=addCand(all,{trip:trips[k],under,unknown});
      if(k===0) main = all.length>before ? c : null;
    }
    if(!main || main.unknown) return;
    const toBlock=main.under.filter(avoided);
    if(!toBlock.length || excludes.length+toBlock.length>MAX_EXCLUDE) return;
    excludes.push(...toBlock.map(u=>midpointWithHeading(u.coords)));
    progress(`지하 구간 ${excludes.length}곳 피하는 중…`);
  }
}
const VARIANTS=[
  {opts:{use_highways:0}, label:'고속도로를 덜 쓰는 길 확인 중…'},
  {opts:{shortest:true},  label:'가장 짧은 길 확인 중…'}
];
async function search(progress){
  const all=[];
  const base=state.manual.slice();
  await refine(all,base,null,MAX_ROUNDS,progress,true);
  // 터널은 고속도로·자동차전용도로에 많아서, 성격이 다른 길도 따로 찾아 후보로 비교
  for(const v of VARIANTS){
    progress(v.label);
    try{ await refine(all,base.slice(),v.opts,3,progress,false); }catch(e){ if(e.fatal) break; }
  }
  if(!all.length) throw new Error('경로를 찾지 못했어요. 출발지와 목적지를 확인해 주세요.');
  return all;
}

/* ---------- 6단계: 지도 표시 ---------- */
function labelOf(u){ return (u.kind==='tunnel'?'터널':'지하차도')+(u.name?` · ${u.name}`:''); }
function summaryOf(c){
  if(c.unknown) return '지하 구간 확인 못 함';
  if(!c.under.length) return '지하 구간 없음';
  return `지하 ${c.under.length}곳 · ${km(c.underLen)}`;
}
function draw(){
  const {a,b}=state, c=state.cands[state.sel], trip=c.trip;
  layer.clearLayers();
  setFollow(false);   // 경로 전체를 보여 주는 동안은 내 위치 따라가기 멈춤
  // 고르지 않은 후보는 회색으로, 누르면 선택
  state.cands.forEach((o,i)=>{ if(i===state.sel) return;
    L.polyline(decode(o.trip.legs[0].shape).map(([x,y])=>[y,x]),{color:css('--muted'),weight:6,opacity:.55})
      .on('click',()=>{ state.sel=i; draw(); }).addTo(layer); });
  const coords=decode(trip.legs[0].shape).map(([x,y])=>[y,x]);
  L.polyline(coords,{color:css('--route'),weight:7,opacity:.95}).addTo(layer);

  // 후보 카드
  const box=$('#cands'); box.innerHTML='';
  box.hidden = state.cands.length<2;
  $('#candNote').textContent = state.cands.length<2 ? '이 구간에서는 비교할 만한 다른 길이 없어요.' : '';
  state.cands.forEach((o,i)=>{
    const btn=document.createElement('button'); btn.type='button'; btn.className='cand';
    btn.setAttribute('role','radio'); btn.setAttribute('aria-checked',i===state.sel);
    btn.innerHTML='<b></b><span></span><em></em>';
    btn.children[0].textContent=o.tag||`후보 ${i+1}`;
    btn.children[1].textContent=mins(o.time);
    btn.children[2].textContent=`${km(o.dist)} · ${summaryOf(o)}`;
    btn.onclick=()=>{ state.sel=i; draw(); };
    box.appendChild(btn);
  });

  // 지하 구간 목록 + 구간별 우회 버튼
  const ul=$('#underList'); ul.innerHTML='';
  c.under.forEach(u=>{
    const pl=L.polyline(u.coords.map(([x,y])=>[y,x]),{color:css('--under'),weight:9}).bindPopup(`${labelOf(u)} (${km(u.len)})`).addTo(layer);
    const li=document.createElement('li');
    li.innerHTML='<span class="u-name"></span><span class="u-len"></span><button type="button" class="u-avoid">이 구간 피하기</button>';
    li.children[0].textContent=labelOf(u); li.children[1].textContent=km(u.len);
    li.onclick=()=>{ map.fitBounds(pl.getBounds(),{maxZoom:16}); pl.openPopup(); };
    li.children[2].onclick=ev=>{ ev.stopPropagation(); avoidSegment(u); };
    ul.appendChild(li);
  });
  L.circleMarker([a.lat,a.lng],{radius:9,color:'#fff',weight:3,fillColor:css('--route'),fillOpacity:1}).bindTooltip('출발').addTo(layer);
  L.circleMarker([b.lat,b.lng],{radius:9,color:'#fff',weight:3,fillColor:css('--ink'),fillOpacity:1}).bindTooltip('도착').addTo(layer);
  map.fitBounds(L.latLngBounds(coords),{padding:[30,30]});

  const pct=Math.max(0,Math.min(100,100-c.underLen/c.dist*100));
  $('#pct').textContent=(pct>=99.95?100:pct.toFixed(1))+'%';
  $('#bar').innerHTML=c.under.length?`<i style="width:${Math.max(1.5,100-pct)}%;margin-left:auto"></i>`:'';
  const t=c.under.filter(u=>u.kind==='tunnel').length;
  $('#meta').textContent=`${km(c.dist)} · 약 ${mins(c.time)} · `+(c.under.length?`터널 ${t}곳, 지하차도 ${c.under.length-t}곳 포함`:'터널·지하차도 없음');

  clearMsg();
  if(c.unknown) showMsg('지하 구간 정보를 확인하지 못해 일반 경로를 보여 드려요. 잠시 후 다시 검색해 주세요.');
  else if(c.blocked>0){
    const better=state.cands.find(o=>o.blocked<c.blocked);
    showMsg(better ? `지하 구간이 더 적은 후보가 있어요. 위의 '${better.tag||'다른 후보'}'를 눌러 비교해 보세요.`
                   : '자동으로 피할 수 없는 지하 구간이 남아 있어요. 아래 목록의 \'이 구간 피하기\'를 누르면 그 구간을 막고 다른 길을 찾아봐요.');
  }
  else if(c.under.length) showMsg(`피하도록 설정하지 않은 ${state.avoidT?'지하차도':'터널'} 구간이 주황색으로 표시돼요. 필요하면 '이 구간 피하기'를 눌러 보세요.`,'info');

  const ol=$('#steps'); ol.innerHTML='';
  (trip.legs[0].maneuvers||[]).forEach(s=>{ const li=document.createElement('li'); li.textContent=s.instruction;
    if(s.length){ const sp=document.createElement('span'); sp.textContent=km(s.length*1000); li.appendChild(sp); } ol.appendChild(li); });
  $('#form').hidden=true; $('#result').classList.add('show');
}

/* ---------- 구간별 우회 ---------- */
let busy=false;
async function avoidSegment(u){
  if(busy) return; busy=true;
  const pt=midpointWithHeading(u.coords);
  state.manual.push(pt);
  showMsg(`${labelOf(u)} 구간을 피하는 길을 찾는 중…`,'info');
  try{
    const all=await search(t=>showMsg(t,'info'));
    const still=all.every(c=>c.under.some(x=>hav([x.coords[0][0],x.coords[0][1]],u.coords[0])<30));
    if(still){ state.manual.pop(); showMsg(`${labelOf(u)} 구간을 피해서 가는 길이 없어요. 지금 경로를 그대로 쓰는 것이 가장 짧은 지하 구간이에요.`); busy=false; return; }
    state.cands=pickCands(all); state.sel=0; draw();
  }catch(e){
    state.manual.pop();
    const noPath=e.code===442||/no path/i.test(e.message||'');
    showMsg(noPath?`${labelOf(u)} 구간을 피해서 가는 길이 없어요.`:(e.message||'다른 길을 찾지 못했어요.'));
  }
  busy=false;
}

/* ---------- PWA: 설치·오프라인 ---------- */
if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let installPrompt=null;
const isInstalled = matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
if(isInstalled) $('#install').hidden=true;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installPrompt=e; });
$('#install').onclick=async()=>{
  if(installPrompt){
    installPrompt.prompt(); const r=await installPrompt.userChoice; installPrompt=null;
    if(r.outcome==='accepted') $('#install').hidden=true;
    return;
  }
  const ua=navigator.userAgent;
  let how;
  if(/KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\//i.test(ua))
    how='지금은 앱 안의 내장 브라우저로 열려 있어서 설치할 수 없어요. 오른쪽 위 메뉴에서 \'다른 브라우저로 열기\'를 누른 뒤 다시 시도해 주세요.';
  else if(/SamsungBrowser/i.test(ua))
    how='삼성 인터넷: 주소창 옆 설치 아이콘(↓)을 누르거나, 하단 ≡ 메뉴 → \'현재 페이지 추가\' → \'홈 화면\'을 눌러 주세요.';
  else if(/Android/i.test(ua))
    how='크롬: 오른쪽 위 ⋮ 메뉴 → \'앱 설치\' 또는 \'홈 화면에 추가\' → \'설치\'를 눌러 주세요. 이미 설치돼 있다면 앱 목록에서 트인길을 찾아 열어 주세요.';
  else if(/iPhone|iPad/i.test(ua))
    how='사파리: 아래쪽 공유 버튼 → \'홈 화면에 추가\'를 눌러 주세요.';
  else
    how='PC 크롬·엣지: 주소창 오른쪽의 설치 아이콘을 누르거나, 메뉴에서 \'앱 설치\'를 눌러 주세요.';
  showMsg(how,'info');
};
window.addEventListener('appinstalled',()=>{ $('#install').hidden=true; });
window.addEventListener('offline',()=>showMsg('인터넷 연결이 끊겼어요. 지도와 경로 검색은 연결된 뒤에 다시 할 수 있어요.'));
window.addEventListener('online',clearMsg);

$('#again').onclick=()=>{ $('#result').classList.remove('show'); $('#form').hidden=false; state.manual=[]; clearMsg(); };

/* ---------- 실행 ---------- */
$('#form').addEventListener('submit',async ev=>{
  ev.preventDefault(); clearMsg();
  const go=$('#go'); go.disabled=true; go.textContent='경로를 찾는 중…';
  try{
    const [a,b]=await Promise.all([geocode($('#from')),geocode($('#to'))]);
    $('#fromRes').textContent=a.label; $('#toRes').textContent=b.label;
    Object.assign(state,{a,b,avoidT:$('#avoidTunnel').checked,avoidU:$('#avoidUnder').checked,manual:[]});
    const all=await search(t=>{ go.textContent=t; });
    state.cands=pickCands(all); state.sel=0; draw();
  }catch(e){
    const noPath=e.code===442||/no path/i.test(e.message||'');
    showMsg(noPath?'두 장소를 잇는 차도를 찾지 못했어요. 출발지와 목적지를 도로 가까운 곳으로 바꿔 보세요.':(e.message||'경로를 찾지 못했어요.'));
  }finally{ go.disabled=false; go.textContent='경로 탐색'; }
});
</script>
